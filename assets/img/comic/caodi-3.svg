<title id="title">草地 · 雨昼寒夜 · 木刻艺术演绎</title>
<desc id="desc">画面左半为乌云雨昼，右半为星空弯月和低温图标；一队背影踏草墩横穿两半，表现雨季天气变化和昼夜温差。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
