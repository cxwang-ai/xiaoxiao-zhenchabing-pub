<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">安顺场 · 南岸渡口 · 木刻艺术演绎</title>
<desc id="desc">石阶伸入河边，岸桩以绳系住木船；岸上一座木骨石墙碉楼，路边小木牌写着安顺场。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
