<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">安顺场 · 雨夜抵达 · 木刻艺术演绎</title>
<desc id="desc">暗夜斜雨中，一小队背影沿河岸山道前行；激流对岸远处可见安顺场老街低矮屋顶。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
