<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">日干乔 · 高原湿地 · 木刻艺术演绎</title>
<desc id="desc">开阔天空下，低矮地平线和平缓远山前是一望无际的湿地，水洼反光与成片草墩交错。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
