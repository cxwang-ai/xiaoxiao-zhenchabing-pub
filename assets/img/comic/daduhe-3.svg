<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">大渡河 · 激流渡船 · 木刻艺术演绎</title>
<desc id="desc">两岸峭壁间，一条木船载着十七名无面部剪影；多人前倾划桨，木船穿过翻卷白浪。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
