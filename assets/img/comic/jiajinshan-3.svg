<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">夹金山 · 风雪相扶 · 木刻艺术演绎</title>
<desc id="desc">昏暗风雪中，五名剪影手拉着手迎风前倾登坡；斜向雪片刀痕和圆粒冰雹掠过山路。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
