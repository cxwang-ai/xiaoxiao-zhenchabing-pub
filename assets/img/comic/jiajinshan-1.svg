<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">夹金山 · 王母寨垭口 · 木刻艺术演绎</title>
<desc id="desc">两座雪峰之间形成鞍部，之字山路通向垭口石碑；山脚三名背影仰望雪山。 原创示意构图，不表示实测地形；人物均为虚构无面部剪影。</desc>
